# Continuous integration. R2 added the i18n key check, R3 adds the overlap audit. This workflow has not run on GitHub yet.
# NOTE: this workflow has not been run on GitHub yet. It mirrors the commands that pass locally.
name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm i18n:check
      - run: pnpm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # High and critical advisories fail the build. Moderate ones are reviewed by hand.
      - run: pnpm audit --audit-level=high

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history, so an old leaked key is found too
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Production build and unsafe-config refusal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build with placeholder values (pages are rendered per request, nothing is contacted)
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          APP_ENV: PRODUCTION
      - name: A production server with unsafe settings must stop with exit code 1
        env:
          APP_ENV: PRODUCTION
          LLM_PROVIDER: mock
          SEED_DEMO: "true"
          APP_URL: http://example.test
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: |
          code=0
          timeout 60 pnpm start -p 3199 > boot.log 2>&1 || code=$?
          cat boot.log
          test "$code" -eq 1
          grep -q "LLM_PROVIDER=mock is refused" boot.log
          grep -q "SEED_DEMO=true is refused" boot.log

  database:
    name: Database tests (local Supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local stack
        run: supabase start -x imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
      - name: Write .env.localstack from the running stack
        run: |
          supabase status -o env > status.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "LLM_PROVIDER=mock"
            echo "APP_ENV=LOCAL"
          } > .env.localstack
      - run: supabase db reset
      - run: pnpm test:db
      - name: Migration dry run on legacy-shaped data
        run: node scripts/migrate-r1-dry-run.mjs

  overlap-audit:
    name: Overlap audit (Playwright, blocks merging)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start the local stack and seed demo data
        run: |
          supabase start -x imgproxy,edge-runtime,logflare,vector,supavisor,mailpit
          supabase status -o env > status.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' status.env | cut -d= -f2- | tr -d '\"')"
            echo "LLM_PROVIDER=mock"
            echo "APP_ENV=LOCAL"
            echo "SEED_DEMO=true"
          } > .env.localstack
          supabase db reset
          pnpm seed:storage
          pnpm seed:admin
      - run: pnpm exec playwright install --with-deps chromium
      # Home, Explore, project, wizard steps, dashboard, request pages, admin pages and the advisor page,
      # at 360x740, 390x844, 768x1024, 1024x768, 1280x800 and 1536x864.
      - run: pnpm exec playwright test tests/e2e/overlap.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: overlap-audit-results
          path: test-results/
